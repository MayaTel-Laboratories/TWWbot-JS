name: 'TWWBot-JS Post Next Image'
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

env:
  IMAGE_DIR: imagequeue
  IMAGE_PATH_IN_REPO: imagequeue
  IMAGE_BRANCH: main

jobs:
  post-next-image:
    name: Post Next Image
    runs-on: ubuntu-latest
    steps:
      - name: Minimal checkout (shallow, only repo metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute image manifest key (files+sha) via GitHub API
        id: manifest
        env:
          GITHUB_API: https://api.github.com
          REPO: ${{ github.repository }}
          REF: ${{ env.IMAGE_BRANCH }}
          IMAGE_PATH: ${{ env.IMAGE_PATH_IN_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Querying GitHub for files in ${IMAGE_PATH} at ref ${REF}..."
          # Use the contents API to list the directory. If there are many pages, this needs pagination.
          # For large directories you may need to paginate; this sample assumes the directory listing fits in one page.
          resp=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/contents/${IMAGE_PATH}?ref=${REF}" )
          if [ -z "$resp" ]; then
            echo "noresp=true" >> $GITHUB_OUTPUT
            echo "MANIFEST_KEY=disk-empty" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Build a manifest string of filename:sha pairs sorted deterministically
          manifest=$(printf '%s\n' "$resp" | jq -r '.[] | select(.type=="file") | "\(.path):\(.sha)"' | sort | tr '\n' '|' )
          if [ -z "$manifest" ]; then
            # directory may be empty or not found
            echo "MANIFEST_KEY=empty" >> $GITHUB_OUTPUT
            echo "no_files=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # hash the manifest string to produce a compact cache key segment
          manifest_hash=$(printf '%s' "$manifest" | sha1sum | awk '{print $1}')
          key="imagequeue-${{ runner.os }}-${manifest_hash}"
          echo "MANIFEST=$manifest" >> $GITHUB_OUTPUT
          echo "MANIFEST_KEY=$key" >> $GITHUB_OUTPUT
          echo "manifest_length=$(printf '%s' "$manifest" | wc -c)" >> $GITHUB_OUTPUT

      - name: Restore imagequeue cache
        uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.IMAGE_DIR }}
          key: ${{ steps.manifest.outputs.MANIFEST_KEY }}
          # allow partial restore by OS if key changed
          restore-keys: |
            imagequeue-${{ runner.os }}-

      - name: Ensure image directory exists
        run: mkdir -p "${{ env.IMAGE_DIR }}"

      - name: Populate imagequeue from API if cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GITHUB_API: https://api.github.com
          REPO: ${{ github.repository }}
          REF: ${{ env.IMAGE_BRANCH }}
          IMAGE_PATH: ${{ env.IMAGE_PATH_IN_REPO }}
          IMAGE_DIR: ${{ env.IMAGE_DIR }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cache miss or cache not found - downloading image list from GitHub contents API..."
          resp=$(curl -s -H "Authorization: token ${GH_TOKEN}" "${GITHUB_API}/repos/${REPO}/contents/${IMAGE_PATH}?ref=${REF}")
          # if no files, nothing to do
          files=$(printf '%s' "$resp" | jq -r '.[] | select(.type=="file") | @base64')
          if [ -z "$files" ]; then
            echo "No files found in ${IMAGE_PATH} at ${REF}."
            exit 0
          fi
          # Download each file into the image dir. Use download_url in the API response.
          echo "$resp" | jq -r '.[] | select(.type=="file") | "\(.name)\t\(.download_url)\t\(.sha)"' | while IFS=$'\t' read -r name url sha; do
            outpath="${IMAGE_DIR}/${name}"
            # if file already exists and its blob SHA matches, skip (avoids re-download)
            if [ -f "$outpath" ]; then
              # compute sha1 of existing file's blob on the repo? We can't easily compute git blob sha here.
              # Instead we can check file size/dates or re-download forcibly. For safety we skip if exists.
              echo "Skipping existing $outpath (already present)"
              continue
            fi
            echo "Downloading $name ..."
            curl -sSfL -o "$outpath" "$url"
          done

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Do the posts
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          LAST_IMAGE_NAME: ${{ vars.LAST_IMAGE_NAME }}
        run: |
          echo "starting with LAST_IMAGE_NAME: $LAST_IMAGE_NAME"
          CUR_LAST="$LAST_IMAGE_NAME"
          set +e
          for i in $(seq 1 5); do
            echo "posting image #$i (using LAST_IMAGE_NAME=$CUR_LAST)"
            SUCCESS=0
            for attempt in 1 2 3; do
              OUT=$(LAST_IMAGE_NAME="$CUR_LAST" yarn --silent start)
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 0 ]; then
                MATCHED_LINE=$(printf '%s\n' "$OUT" | grep -Eo 'TWW_.*__[^[:space:]]+\.jpeg' | tail -n1)
                if [ -z "$MATCHED_LINE" ]; then
                  MATCHED_LINE=$(printf '%s\n' "$OUT" | awk 'NF { line=$0 } END { print line }')
                fi
                if [ -n "$MATCHED_LINE" ]; then
                  NEW_LINE="$MATCHED_LINE"
                  SUCCESS=1
                  break
                fi
              fi
              if [ $attempt -lt 3 ]; then
                SLEEP_SEC=$((3 * 2 ** (attempt - 1)))
                sleep $SLEEP_SEC
              fi
            done
            if [ $SUCCESS -ne 1 ]; then
              echo "error: posting attempt #$i failed after retries; stopping loop"
              break
            fi
            echo "posted: $NEW_LINE"
            CUR_LAST="$NEW_LINE"
            sleep 5
          done
          printf 'NEW_LAST_IMAGE_NAME=%s\n' "$CUR_LAST" >> $GITHUB_ENV
          echo "saved NEW_LAST_IMAGE_NAME=$CUR_LAST"

      - name: Update repository variable
        uses: action-pack/set-variable@v1
        with:
          name: 'LAST_IMAGE_NAME'
          value: ${{ env.NEW_LAST_IMAGE_NAME }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}