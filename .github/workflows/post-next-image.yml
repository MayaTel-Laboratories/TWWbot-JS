name: 'TWWBot-JS Post Next Image'
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  post-next-image:
    name: Post Next Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Do the post
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          LAST_IMAGE_NAME: ${{ vars.LAST_IMAGE_NAME }}
        run: |
          echo "Previous image name: $LAST_IMAGE_NAME"
          NEW_VAL=$(yarn --silent run start)
          echo "NEW_LAST_IMAGE_NAME<<EOF" >> $GITHUB_ENV
          echo "$NEW_VAL" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update repository variable
        uses: action-pack/set-variable@v1
        with:
          name: 'LAST_IMAGE_NAME'
          value: ${{ env.NEW_LAST_IMAGE_NAME }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}