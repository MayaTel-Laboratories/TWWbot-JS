name: 'TWWBot-JS Post Next Image'
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  post-next-image:
    name: Post Next Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Do the post (5 times, 5s delay between)
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          LAST_IMAGE_NAME: ${{ vars.LAST_IMAGE_NAME }}
        run: |
          echo "Starting with LAST_IMAGE_NAME: $LAST_IMAGE_NAME"
          CUR_LAST="$LAST_IMAGE_NAME"
          for i in $(seq 1 5); do
            echo "Posting image #$i (using LAST_IMAGE_NAME=$CUR_LAST)"
            NEW_VAL=$(LAST_IMAGE_NAME="$CUR_LAST" yarn --silent start)
            if [ -z "$NEW_VAL" ]; then
              echo "Warning: script returned empty NEW_VAL; aborting loop"
              break
            fi
            echo "Posted: $NEW_VAL"
            CUR_LAST="$NEW_VAL"
            sleep 5
          done
          echo "NEW_LAST_IMAGE_NAME=$CUR_LAST" >> $GITHUB_ENV

      - name: Update repository variable
        uses: action-pack/set-variable@v1
        with:
          name: 'LAST_IMAGE_NAME'
          value: ${{ env.NEW_LAST_IMAGE_NAME }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}