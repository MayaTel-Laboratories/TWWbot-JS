name: 'TWWBot-JS Post Next Image'
on:
  workflow_dispatch:

env:
  IMAGE_DIR: imagequeue
  IMAGE_PATH_IN_REPO: imagequeue
  IMAGE_BRANCH: main
  MANIFEST_JSON: manifest.json

jobs:
  post-next-image:
    name: Post Next Image
    runs-on: ubuntu-latest
    steps:
      - name: checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            package.json
            yarn.lock
            tsconfig.json
            src/
            lib/
            bin/
            .github/scripts/
            manifest.json

      - name: compare cache with live directory
        id: manifest
        env:
          GITHUB_API: https://api.github.com
          REPO: ${{ github.repository }}
          REF: ${{ env.IMAGE_BRANCH }}
          IMAGE_PATH: ${{ env.IMAGE_PATH_IN_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Querying GitHub for files in ${IMAGE_PATH} at ref ${REF}..."

          # Get commit SHA for the branch
          branch_data=$(curl -sSf -H "Authorization: token ${GH_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/branches/${REF}")
          tree_sha=$(printf '%s' "$branch_data" | jq -r '.commit.sha')

          if [ -z "$tree_sha" ] || [ "$tree_sha" = "null" ]; then
            echo "noresp=true" >> $GITHUB_OUTPUT
            echo "MANIFEST_KEY=disk-empty" >> $GITHUB_OUTPUT
            exit 0
          fi

          # List all files via Git Trees API (avoids 1000-file limit)
          resp=$(curl -sSf -H "Authorization: token ${GH_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/git/trees/${tree_sha}?recursive=1")

          truncated=$(printf '%s' "$resp" | jq -r '.truncated')
          if [ "$truncated" = "true" ]; then
            echo "::warning::Git tree response was truncated — some files may be missing!"
          fi

          manifest=$(printf '%s' "$resp" \
            | jq -r --arg prefix "${IMAGE_PATH}/" \
              '.tree[] | select(.type=="blob") | select(.path | startswith($prefix)) | "\(.path):\(.sha)"' \
            | sort | tr '\n' '|')

          if [ -z "$manifest" ]; then
            echo "MANIFEST_KEY=empty" >> $GITHUB_OUTPUT
            echo "no_files=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          manifest_hash=$(printf '%s' "$manifest" | sha1sum | awk '{print $1}')
          key="imagequeue-${{ runner.os }}-${manifest_hash}"
          echo "MANIFEST=$manifest" >> $GITHUB_OUTPUT
          echo "MANIFEST_KEY=$key" >> $GITHUB_OUTPUT
          echo "manifest_length=$(printf '%s' "$manifest" | wc -c)" >> $GITHUB_OUTPUT

      - name: restore imagequeue cache
        uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.IMAGE_DIR }}
          key: ${{ steps.manifest.outputs.MANIFEST_KEY }}
          restore-keys: |
            imagequeue-${{ runner.os }}-

      - name: ensure image directory exists
        run: mkdir -p "${{ env.IMAGE_DIR }}"

      - name: populate imagequeue (on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GITHUB_API: https://api.github.com
          REPO: ${{ github.repository }}
          REF: ${{ env.IMAGE_BRANCH }}
          IMAGE_PATH: ${{ env.IMAGE_PATH_IN_REPO }}
          IMAGE_DIR: ${{ env.IMAGE_DIR }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cache miss - downloading image list from GitHub Trees API..."

          # Get commit SHA for the branch
          branch_data=$(curl -sSf -H "Authorization: token ${GH_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/branches/${REF}")
          tree_sha=$(printf '%s' "$branch_data" | jq -r '.commit.sha')

          if [ -z "$tree_sha" ] || [ "$tree_sha" = "null" ]; then
            echo "No tree SHA found, exiting."
            exit 0
          fi

          # List all files via Git Trees API (avoids 1000-file limit)
          resp=$(curl -sSf -H "Authorization: token ${GH_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/git/trees/${tree_sha}?recursive=1")

          truncated=$(printf '%s' "$resp" | jq -r '.truncated')
          if [ "$truncated" = "true" ]; then
            echo "::warning::Git tree response was truncated — some files may be missing!"
          fi

          files=$(printf '%s' "$resp" \
            | jq -r --arg prefix "${IMAGE_PATH}/" \
              '.tree[] | select(.type=="blob") | select(.path | startswith($prefix)) | .path')

          if [ -z "$files" ]; then
            echo "No files found in ${IMAGE_PATH} at ${REF}."
            exit 0
          fi

          echo "$files" | while IFS= read -r filepath; do
            name=$(basename "$filepath")
            outpath="${IMAGE_DIR}/${name}"

            if [ -f "$outpath" ]; then
              echo "Skipping existing $outpath"
              continue
            fi

            echo "Downloading $name ..."

            # URL-encode the path so curl doesn't fail on spaces/special chars
            encoded_path=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$filepath")

            curl -sSfL \
              -H "Authorization: token ${GH_TOKEN}" \
              -o "$outpath" \
              "https://raw.githubusercontent.com/${REPO}/${REF}/${encoded_path}"
          done

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          if [ -f yarn.lock ]; then
            if grep -q '^# yarn lockfile v1' yarn.lock 2>/dev/null || grep -q '^# do not touch' yarn.lock 2>/dev/null; then
              corepack prepare yarn@1.22.19 --activate
              yarn install --frozen-lockfile || (echo "::warning::yarn --frozen-lockfile failed; falling back to plain 'yarn install'"; yarn install)
            else
              corepack prepare yarn@stable --activate
              if yarn install --immutable --immutable-cache; then
                echo "yarn modern install succeeded with --immutable."
              else
                yarn install
              fi
            fi
          else
            corepack prepare yarn@stable --activate
            yarn install
          fi

      - name: Do the posts
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          LAST_IMAGE_NAME: ${{ vars.LAST_IMAGE_NAME }}
          MANIFEST_JSON: ${{ env.MANIFEST_JSON }}
        shell: bash
        run: |
          echo "starting with LAST_IMAGE_NAME: $LAST_IMAGE_NAME"
          CUR_LAST="$LAST_IMAGE_NAME"
          set +e
          for i in $(seq 1 5); do
            SUCCESS=0
            for attempt in 1 2 3; do
              OUT=$(LAST_IMAGE_NAME="$CUR_LAST" yarn --silent start)
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 0 ]; then
                MATCHED_LINE=$(printf '%s\n' "$OUT" | grep -Eo 'TWW_.*__[^[:space:]]+\.jpeg' | tail -n1)
                if [ -z "$MATCHED_LINE" ]; then
                  MATCHED_LINE=$(printf '%s\n' "$OUT" | awk 'NF { line=$0 } END { print line }')
                fi
                if [ -n "$MATCHED_LINE" ]; then
                  NEW_LINE="$MATCHED_LINE"
                  SUCCESS=1
                  break
                fi
              fi
              if [ $attempt -lt 3 ]; then
                SLEEP_SEC=$((3 * 2 ** (attempt - 1)))
                sleep $SLEEP_SEC
              fi
            done
            if [ $SUCCESS -ne 1 ]; then
              echo "error: posting attempt #$i failed after retries; stopping loop"
              break
            fi
            CUR_LAST="$NEW_LINE"
            sleep 5
          done
          printf 'NEW_LAST_IMAGE_NAME=%s\n' "$CUR_LAST" >> $GITHUB_ENV
          echo "saved NEW_LAST_IMAGE_NAME=$CUR_LAST"

      - name: Update repository variable
        uses: action-pack/set-variable@v1
        with:
          name: 'LAST_IMAGE_NAME'
          value: ${{ env.NEW_LAST_IMAGE_NAME }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}