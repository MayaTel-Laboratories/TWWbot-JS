name: 'TWWBot-JS Post Next Image'
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

env:
  IMAGE_DIR: imagequeue
  IMAGE_PATH_IN_REPO: imagequeue
  IMAGE_BRANCH: main
  POSTS_PER_RUN: '5' 

jobs:
  post-next-image:
    name: Post Next Image
    runs-on: ubuntu-latest
    steps:
      - name: checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            package.json
            yarn.lock
            tsconfig.json
            src/
            lib/
            bin/
            .github/scripts/

      - name: compute image manifest (files + sha)
        id: manifest
        env:
          GITHUB_API: https://api.github.com
          REPO: ${{ github.repository }}
          REF: ${{ env.IMAGE_BRANCH }}
          IMAGE_PATH: ${{ env.IMAGE_PATH_IN_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Querying GitHub for files in ${IMAGE_PATH} at ref ${REF}..."
          resp=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/contents/${IMAGE_PATH}?ref=${REF}")

          if [ -z "$resp" ] || [ "$(printf '%s' "$resp" | jq -r 'type')" = "null" ]; then
            echo "noresp=true" >> $GITHUB_OUTPUT
            echo "MANIFEST_KEY=disk-empty" >> $GITHUB_OUTPUT
            echo "MANIFEST_JSON=" >> $GITHUB_OUTPUT
            exit 0
          fi
          manifest=$(printf '%s\n' "$resp" | jq -r '.[] | select(.type=="file") | "\(.path):\(.sha)"' | sort | tr '\n' '|' )
          if [ -z "$manifest" ]; then
            echo "MANIFEST_KEY=empty" >> $GITHUB_OUTPUT
            echo "no_files=true" >> $GITHUB_OUTPUT
            echo "MANIFEST_JSON=" >> $GITHUB_OUTPUT
            exit 0
          fi

          manifest_hash=$(printf '%s' "$manifest" | sha1sum | awk '{print $1}')
          key="imagequeue-manifest-${{ runner.os }}-${manifest_hash}"
          mkdir -p .image-manifest
          printf '%s\n' "$resp" > .image-manifest/manifest.json

          echo "MANIFEST=$manifest" >> $GITHUB_OUTPUT
          echo "MANIFEST_KEY=$key" >> $GITHUB_OUTPUT
          echo "MANIFEST_JSON=.image-manifest/manifest.json" >> $GITHUB_OUTPUT
          echo "manifest_length=$(printf '%s' "$manifest" | wc -c)" >> $GITHUB_OUTPUT

      - name: cache small manifest metadata
        uses: actions/cache@v4
        with:
          path: .image-manifest
          key: ${{ steps.manifest.outputs.MANIFEST_KEY }}
          restore-keys: |
            imagequeue-manifest-${{ runner.os }}-

      - name: ensure image directory exists
        run: mkdir -p "${{ env.IMAGE_DIR }}"

      - name: download only next images (deterministic numeric order)
        env:
          POSTS_PER_RUN: ${{ env.POSTS_PER_RUN }}
          IMAGE_DIR: ${{ env.IMAGE_DIR }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ env.IMAGE_BRANCH }}
          IMAGE_PATH: ${{ env.IMAGE_PATH_IN_REPO }}
          LAST_IMAGE_NAME: ${{ vars.LAST_IMAGE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          N=${POSTS_PER_RUN:-5}
          mkdir -p "${IMAGE_DIR}"

          echo "Fetching manifest from API..."
          resp=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/contents/${IMAGE_PATH}?ref=${REF}")

          if [ -z "$resp" ]; then
            echo "No manifest returned; nothing to download."
            exit 0
          fi
          sorted_file=$(mktemp)
          python3 - <<'PY' > "${sorted_file}"
import sys, json, re
data = json.load(sys.stdin)
items = []
pat = re.compile(r'^TWW_(\d+)x(\d{1,})_(.*?)__(\d+)\.(jpe?g|png|gif|bmp)$', re.I)
for it in data:
    if it.get('type') != 'file': 
        continue
    name = it.get('name','')
    m = pat.match(name)
    if not m:
        continue
    season = int(m.group(1))
    episode = int(m.group(2))
    frame = int(m.group(4))
    url = it.get('download_url','')
    items.append((season, episode, frame, name, url))
items.sort()
for s,e,f,name,url in items:
    print(f"{s}\t{e}\t{f}\t{name}\t{url}")
PY
          printf '%s\n' "$resp" | python3 - "${sorted_file}" 2>/dev/null || true
          if [ ! -s "${sorted_file}" ]; then
            echo "No TWW images found in manifest (after parsing)."
            exit 0
          fi
          mapfile -t lines < "${sorted_file}"
          names=()
          urls=()
          for l in "${lines[@]}"; do
            name=$(printf '%s' "$l" | awk -F $'\t' '{print $4}')
            url=$(printf '%s' "$l" | awk -F $'\t' '{print $5}')
            names+=("$name")
            urls+=("$url")
          done
          start_index=0
          if [ -n "${LAST_IMAGE_NAME:-}" ]; then
            for i in "${!names[@]}"; do
              if [ "${names[i]}" = "${LAST_IMAGE_NAME}" ]; then
                start_index=$((i + 1))
                break
              fi
            done
          else
            start_index=0
          fi
          total=${#names[@]}
          if [ "$total" -eq 0 ]; then
            echo "No names available."
            exit 0
          fi

          to_download=()
          to_download_urls=()
          idx=$start_index
          for cnt in $(seq 1 "$N"); do
            if [ "$idx" -ge "$total" ]; then
              idx=0
            fi
            to_download+=("${names[idx]}")
            to_download_urls+=("${urls[idx]}")
            idx=$((idx + 1))
          done

          echo "will download ${#to_download[@]} images (next ${N})."
          for i in "${!to_download[@]}"; do
            name="${to_download[i]}"
            url="${to_download_urls[i]}"
            outpath="${IMAGE_DIR}/${name}"
            if [ -f "$outpath" ]; then
              echo "Skipping existing ${name}"
              continue
            fi
            if [ -z "$url" ]; then
              echo "No download URL for ${name}; skipping."
              continue
            fi
            echo "Downloading ${name} ..."
            curl -sSfL -o "$outpath" "$url"
          done

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          if [ -f yarn.lock ]; then
            if grep -q '^# yarn lockfile v1' yarn.lock 2>/dev/null || grep -q '^# do not touch' yarn.lock 2>/dev/null; then
              corepack prepare yarn@1.22.19 --activate
              yarn install --frozen-lockfile || (echo "::warning::yarn --frozen-lockfile failed; falling back to plain 'yarn install'"; yarn install)
            else
              corepack prepare yarn@stable --activate
              if yarn install --immutable --immutable-cache; then
                echo "yarn modern install succeeded with --immutable."
              else
                yarn install
              fi
            fi
          else
            corepack prepare yarn@stable --activate
            yarn install
          fi

      - name: Do the posts
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          LAST_IMAGE_NAME: ${{ vars.LAST_IMAGE_NAME }}
        shell: bash
        run: |
          echo "starting with LAST_IMAGE_NAME: $LAST_IMAGE_NAME"
          CUR_LAST="$LAST_IMAGE_NAME"
          set +e
          for i in $(seq 1 5); do
            SUCCESS=0
            for attempt in 1 2 3; do
              OUT=$(LAST_IMAGE_NAME="$CUR_LAST" yarn --silent start)
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 0 ]; then
                MATCHED_LINE=$(printf '%s\n' "$OUT" | grep -Eo 'TWW_.*__[^[:space:]]+\.jpeg' | tail -n1)
                if [ -z "$MATCHED_LINE" ]; then
                  MATCHED_LINE=$(printf '%s\n' "$OUT" | awk 'NF { line=$0 } END { print line }')
                fi
                if [ -n "$MATCHED_LINE" ]; then
                  NEW_LINE="$MATCHED_LINE"
                  SUCCESS=1
                  break
                fi
              fi
              if [ $attempt -lt 3 ]; then
                SLEEP_SEC=$((3 * 2 ** (attempt - 1)))
                sleep $SLEEP_SEC
              fi
            done
            if [ $SUCCESS -ne 1 ]; then
              echo "error: posting attempt #$i failed after retries; stopping loop"
              break
            fi
            CUR_LAST="$NEW_LINE"
            sleep 5
          done
          printf 'NEW_LAST_IMAGE_NAME=%s\n' "$CUR_LAST" >> $GITHUB_ENV
          echo "saved NEW_LAST_IMAGE_NAME=$CUR_LAST"

      - name: Update repository variable
        uses: action-pack/set-variable@v1
        with:
          name: 'LAST_IMAGE_NAME'
          value: ${{ env.NEW_LAST_IMAGE_NAME }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}