name: 'TWWBot-JS Post Next Image'
on:
  #workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  post-next-image:
    name: Post Next Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Do the posts
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          LAST_IMAGE_NAME: ${{ vars.LAST_IMAGE_NAME }}
        run: |
          echo "starting with LAST_IMAGE_NAME: $LAST_IMAGE_NAME"
          CUR_LAST="$LAST_IMAGE_NAME"
          set +e
          for i in $(seq 1 5); do
            echo "posting image #$i (using LAST_IMAGE_NAME=$CUR_LAST)"
            OUT=$(LAST_IMAGE_NAME="$CUR_LAST" yarn --silent start 2> >(tee /dev/stderr))
            EXIT_CODE=$?
            if [ $EXIT_CODE -ne 0 ]; then
              echo "error: posting attempt #$i failed with exit code $EXIT_CODE; stopping loop"
              break
            fi
            if [ -z "$OUT" ]; then
              echo "error: posting attempt #$i returned empty output; stopping loop"
              break
            fi
            echo "posted: $OUT"
            CUR_LAST="$OUT"
            sleep 5
          done
          echo "NEW_LAST_IMAGE_NAME=$CUR_LAST" >> $GITHUB_ENV
          echo "saved NEW_LAST_IMAGE_NAME=$CUR_LAST"
      - name: Update repository variable
        uses: action-pack/set-variable@v1
        with:
          name: 'LAST_IMAGE_NAME'
          value: ${{ env.NEW_LAST_IMAGE_NAME }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}